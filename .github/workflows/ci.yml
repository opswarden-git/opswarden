---
name: CI
run-name: "CI · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} · ${{ github.sha }}"

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  workflow-quality:
    name: Workflow · Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: zizmor
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "${RUNNER_TEMP}" actionlint
          install -m 0755 "${RUNNER_TEMP}/actionlint" /usr/local/bin/actionlint
      - name: Validate GitHub Actions workflows
        run: |
          actionlint -color
          zizmor .github/workflows
      - name: Validate shell scripts
        run: find tooling -type f -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Verify package versions
        run: ./tooling/verify_release_version.sh

  changes:
    name: Changes · Detect
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            server:
              - 'server/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'tooling/deny.toml'
              - 'tooling/tarpaulin.toml'
              - 'tooling/summarize_{rust_tests,source_coverage}.sh'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/**'
            web:
              - 'client-web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tooling/summarize_web_tests.sh'
              - 'tooling/audit_npm.sh'
              - 'tooling/e2e/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/**'
            desktop:
              - 'client-desktop/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tooling/smoke_compose_appimage.sh'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            e2e:
              - 'server/**'
              - 'client-web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tooling/e2e/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/**'

  backend-quality:
    name: Backend · Quality & security
    needs: [workflow-quality, changes]
    if: needs.changes.outputs.server == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint without warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install cargo-audit
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-deny@0.19.7
      - name: Enforce dependency and license policy
        run: cargo deny check --config tooling/deny.toml

  backend-test:
    name: Backend · Build & test
    needs: [workflow-quality, changes, backend-quality]
    if: needs.changes.outputs.server == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: opswarden
          POSTGRES_DB: opswarden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      POSTGRES_USER: opswarden
      POSTGRES_DB: opswarden
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install sqlx-cli
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: sqlx-cli
      - name: Configure test database
        run: echo "DATABASE_URL=postgres://${POSTGRES_USER}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"
      - name: Apply database migrations
        run: sqlx migrate run --source server/migrations
      - name: Build workspace
        run: cargo build --workspace --verbose
      - name: Run tests
        run: |
          mkdir -p target/test-results
          cargo test --workspace --verbose 2>&1 | tee target/test-results/rust.log
      - name: Publish test summary
        run: ./tooling/summarize_rust_tests.sh

  backend-coverage:
    name: Backend · Coverage
    needs: [changes, backend-test]
    if: needs.changes.outputs.server == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: opswarden
          POSTGRES_DB: opswarden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      POSTGRES_USER: opswarden
      POSTGRES_DB: opswarden
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install coverage and database tools
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-tarpaulin,sqlx-cli
      - name: Configure test database
        run: echo "DATABASE_URL=postgres://${POSTGRES_USER}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"
      - name: Apply database migrations
        run: sqlx migrate run --source server/migrations
      - name: Measure source coverage
        run: cargo tarpaulin --config tooling/tarpaulin.toml
      - name: Enforce source-only coverage scope
        run: ./tooling/summarize_source_coverage.sh
      - name: Publish coverage summary
        run: |
          summary=target/tarpaulin/source-only-summary.json
          {
            echo '## Backend · Coverage'
            echo
            echo '| Metric | Result |'
            echo '| --- | ---: |'
            echo "| Lines | $(jq -r '.covered_lines')/$(jq -r '.total_lines') |"
            echo "| Coverage | $(jq -r '.line_coverage_percent')% |"
            echo "| Required | $(jq -r '.minimum_percent')% |"
          } < "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-server
          path: target/tarpaulin/
          if-no-files-found: error

  web-quality:
    name: Web · Quality & test
    needs: [workflow-quality, changes]
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint --workspace client-web
      - name: Check formatting
        run: npm run format:check --workspace client-web
      - name: Check types
        run: npm run typecheck --workspace client-web
      - name: Run tests with coverage
        run: |
          mkdir -p target/test-results
          npm run test:coverage --workspace client-web 2>&1 | tee target/test-results/web.log
      - name: Publish test and coverage summary
        run: ./tooling/summarize_web_tests.sh
      - name: Enforce npm security policy
        run: ./tooling/audit_npm.sh
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web
          path: client-web/coverage/
          if-no-files-found: error

  web-build:
    name: Web · Build
    needs: [workflow-quality, changes, web-quality]
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production client
        run: npm run build --workspace client-web

  desktop-linux-package:
    name: Desktop (Linux) · Package
    needs: [workflow-quality, changes]
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Install locked dependencies
        run: npm ci
      - name: Build Debian package
        run: npm run build --workspace client-desktop -- --bundles deb
      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux-deb
          path: client-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  e2e-critical-path:
    name: E2E · Critical path
    needs: [workflow-quality, changes, backend-test, web-build]
    if: >-
      always()
      && (needs.changes.outputs.e2e == 'true' || github.event_name == 'push')
      && needs.workflow-quality.result == 'success'
      && needs.changes.result == 'success'
      && (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped')
      && (needs.web-build.result == 'success' || needs.web-build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start ephemeral application stack
        run: |
          docker compose up --detach --build db server
          docker compose up --detach --build --no-deps client_web
      - name: Wait for application readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health >/dev/null \
              && curl --fail --silent http://localhost:8081/en >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color server client_web
          exit 1
      - name: Run critical browser flow
        run: npm run test:e2e -- tooling/e2e/create-incident-dialog.spec.ts
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-critical-path
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Print service logs after a failure
        if: failure()
        run: docker compose logs --no-color server client_web
      - name: Stop ephemeral application stack
        if: always()
        run: docker compose down --volumes

  required:
    name: CI · Required gate
    needs:
      - workflow-quality
      - changes
      - backend-quality
      - backend-test
      - backend-coverage
      - web-quality
      - web-build
      - desktop-linux-package
      - e2e-critical-path
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the exact expected job set
        env:
          EVENT: ${{ github.event_name }}
          SERVER_CHANGED: ${{ needs.changes.outputs.server }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
          E2E_CHANGED: ${{ needs.changes.outputs.e2e }}
          WORKFLOW_RESULT: ${{ needs.workflow-quality.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_QUALITY_RESULT: ${{ needs.backend-quality.result }}
          BACKEND_TEST_RESULT: ${{ needs.backend-test.result }}
          BACKEND_COVERAGE_RESULT: ${{ needs.backend-coverage.result }}
          WEB_QUALITY_RESULT: ${{ needs.web-quality.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
          DESKTOP_RESULT: ${{ needs.desktop-linux-package.result }}
          E2E_RESULT: ${{ needs.e2e-critical-path.result }}
        run: |
          set -euo pipefail

          require_result() {
            local job=$1 actual=$2 expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "::error title=Unexpected CI result::${job}: expected ${expected}, got ${actual}"
              exit 1
            fi
          }

          expected_for() {
            if [[ "$EVENT" == "push" || "$1" == "true" ]]; then
              echo success
            else
              echo skipped
            fi
          }

          require_result workflow "$WORKFLOW_RESULT" success
          require_result changes "$CHANGES_RESULT" success
          require_result backend-quality "$BACKEND_QUALITY_RESULT" "$(expected_for "$SERVER_CHANGED")"
          require_result backend-test "$BACKEND_TEST_RESULT" "$(expected_for "$SERVER_CHANGED")"
          require_result backend-coverage "$BACKEND_COVERAGE_RESULT" "$(expected_for "$SERVER_CHANGED")"
          require_result web-quality "$WEB_QUALITY_RESULT" "$(expected_for "$WEB_CHANGED")"
          require_result web-build "$WEB_BUILD_RESULT" "$(expected_for "$WEB_CHANGED")"
          require_result desktop-linux-package "$DESKTOP_RESULT" "$(expected_for "$DESKTOP_CHANGED")"
          require_result e2e-critical-path "$E2E_RESULT" "$(expected_for "$E2E_CHANGED")"

          echo "All expected CI jobs passed; every non-applicable job was explicitly skipped."
