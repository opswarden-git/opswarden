---
# Unified CI — server (Rust) + web (Next.js) + desktop (Tauri).
#
# A single "CI Gate" job is the ONLY required status check. The workflow runs on
# every PR (no path filter at the workflow level); a `changes` job detects which
# area changed and feature-branch jobs run conditionally. Every push to main runs
# the complete monorepo build, integration tests, coverage and an E2E smoke test.
# Because the gate always runs, branch protection never blocks a PR for a required
# check that "didn't run".
#
# Runner : ubuntu-latest (GitHub-hosted). Self-hosted later = swap `runs-on`.
name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # dorny/paths-filter lists changed files via the GitHub API on pull_request
  # events; that read needs pull-requests:read (else "Resource not accessible").
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Path filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'tooling/**'
              - '.github/workflows/ci.yml'
            web:
              - 'client-web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            desktop:
              - 'client-desktop/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  server-quality:
    name: Quality & Security (fmt, clippy, audit, deny)
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings = erreurs)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Security audit
        run: cargo audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          # Keep CI aligned with the Nix development shell. cargo-deny 0.20
          # moved --config in its CLI and broke the shared `just ci` command.
          tool: cargo-deny@0.19.7
      - name: License & supply-chain policy (cargo-deny)
        run: cargo deny check --config tooling/deny.toml

  server-build-test:
    name: Build & Test
    needs: [changes, server-quality]
    if: >-
      needs.changes.outputs.server == 'true'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Postgres service for the SQLx integration tests. query! macros compile from
    # the committed .sqlx cache (SQLX_OFFLINE); the DB is only needed at runtime.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opswarden
          POSTGRES_DB: opswarden
          # Ephemeral CI container on localhost: trust auth, no password to store.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SQLX_OFFLINE: "true"
      POSTGRES_USER: opswarden
      POSTGRES_DB: opswarden
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Assemble DATABASE_URL
        run: echo "DATABASE_URL=postgres://${POSTGRES_USER}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"
      - name: Run database migrations
        run: sqlx migrate run --source server/migrations
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose

  server-coverage:
    name: Coverage (tarpaulin → artifact)
    needs: server-build-test
    # VIGIL: every merge to main publishes a backend coverage artifact,
    # independently from the paths changed by the merge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opswarden
          POSTGRES_DB: opswarden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SQLX_OFFLINE: "true"
      POSTGRES_USER: opswarden
      POSTGRES_DB: opswarden
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Assemble DATABASE_URL
        run: echo "DATABASE_URL=postgres://${POSTGRES_USER}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"
      - name: Run database migrations
        run: sqlx migrate run --source server/migrations
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Run coverage
        run: cargo tarpaulin --config tooling/tarpaulin.toml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-server
          path: target/tarpaulin/
          if-no-files-found: error

  web-quality:
    name: Web Quality (eslint, prettier, types)
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (workspace)
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint --workspace client-web
      - name: Format check (Prettier)
        run: npm run format:check --workspace client-web
      - name: Type check (tsc)
        run: npm run typecheck --workspace client-web
      - name: Unit tests (Vitest coverage)
        run: npm run test:coverage --workspace client-web
      - name: Upload frontend coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: client-web/coverage/
          if-no-files-found: error
      - name: Security audit (npm)
        run: npm audit --audit-level=critical || true

  web-build:
    name: Web Build (Next.js)
    needs: [changes, web-quality]
    if: >-
      needs.changes.outputs.web == 'true'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (workspace)
        run: npm ci
      - name: Build
        run: npm run build --workspace client-web

  desktop-build:
    name: Desktop Build (Tauri .deb)
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Install dependencies (workspace)
        run: npm ci
      - name: Build installable desktop package
        run: npm run build --workspace client-desktop -- --bundles deb
      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-deb
          path: client-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  e2e-smoke:
    name: E2E Smoke (Playwright)
    needs: [server-build-test, web-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (workspace)
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Start database, server and web client
        run: |
          docker compose up --detach --build db server
          docker compose up --detach --build --no-deps client_web
      - name: Wait for the web client
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health >/dev/null \
              && curl --fail --silent http://localhost:8081/en >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color server client_web
          exit 1
      - name: Run representative browser flow
        run: npm run test:e2e -- tooling/e2e/create-incident-dialog.spec.ts
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Print service logs after a failure
        if: failure()
        run: docker compose logs --no-color server client_web
      - name: Stop the ephemeral stack
        if: always()
        run: docker compose down --volumes

  gate:
    name: CI Gate
    needs:
      [
        changes,
        server-quality,
        server-build-test,
        server-coverage,
        web-quality,
        web-build,
        desktop-build,
        e2e-smoke,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every triggered job to pass
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.server-quality.result }}
            ${{ needs.server-build-test.result }}
            ${{ needs.server-coverage.result }}
            ${{ needs.web-quality.result }}
            ${{ needs.web-build.result }}
            ${{ needs.desktop-build.result }}
            ${{ needs.e2e-smoke.result }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required CI job did not pass: '$r'"; exit 1 ;;
            esac
          done
          echo "CI Gate: all triggered jobs passed (skipped jobs are allowed)."
