---
name: Documentation
run-name: "Documentation for ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

"on":
  push:
    branches: [main]
    paths:
      - README.md
      - DESIGN_SYSTEM.md
      - UI_GUIDELINES.md
      - HOWTOCONTRIBUTE.md
      - WEBSOCKET_SPEC.md
      - docs/**
      - tooling/docs.sh
      - tooling/inventory/**
      - .github/workflows/documentation.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - DESIGN_SYSTEM.md
      - UI_GUIDELINES.md
      - HOWTOCONTRIBUTE.md
      - WEBSOCKET_SPEC.md
      - docs/**
      - tooling/docs.sh
      - tooling/inventory/**
      - .github/workflows/documentation.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test inventory generator
        run: node --test tooling/inventory/inventory.test.mjs
      - name: Build documentation portal
        run: ./tooling/docs.sh
      - name: Install link checker
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: lychee@0.24.2
      - name: Validate generated internal links
        run: |
          mkdir -p "${RUNNER_TEMP}/documentation-root"
          ln -s "${GITHUB_WORKSPACE}/site" "${RUNNER_TEMP}/documentation-root/opswarden"
          find site -name '*.html' -print0 | xargs -0 lychee --offline --include-fragments --root-dir "${RUNNER_TEMP}/documentation-root"
      - name: Validate external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          find site -name '*.html' -print0 |
            xargs -0 lychee --include-fragments --root-dir "${RUNNER_TEMP}/documentation-root" --max-retries 3 --retry-wait-time 2 --exclude '^https://opswarden-git.github.io/opswarden/'
      - name: Upload generated portal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-site
          path: site
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated portal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-site
          path: publication
      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C publication init --initial-branch=gh-pages
          git -C publication config user.name github-actions[bot]
          git -C publication config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C publication add --all
          git -C publication commit -m "docs: publish ${GITHUB_SHA}"
          git -C publication remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C publication push --force origin HEAD:gh-pages
