name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # creer la GitHub Release
  packages: write # pousser l'image vers ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release Gate (tests must pass)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opswarden
          POSTGRES_DB: opswarden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SQLX_OFFLINE: "true"
      POSTGRES_USER: opswarden
      POSTGRES_DB: opswarden
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Assemble DATABASE_URL
        run: echo "DATABASE_URL=postgres://${POSTGRES_USER}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"
      - name: Run database migrations
        run: sqlx migrate run --source server/migrations
      - name: Rust format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust build and tests
        run: |
          cargo build --workspace --verbose
          cargo test --workspace --verbose
      - name: Web quality, tests and build
        run: |
          npm run lint --workspace client-web
          npm run format:check --workspace client-web
          npm run typecheck --workspace client-web
          npm run test:coverage --workspace client-web
          npm run build --workspace client-web

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour le changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  docker-image:
    name: Build & Push server image (ghcr.io)
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata (tags + labels, owner mis en minuscules)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opswarden-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Phase 3 -- desktop AppImage (Tauri, URL-mode -> http://localhost:8081).
  # Built on ubuntu-22.04 (glibc 2.35), matching the Compose artifact builder.
  # The release gate must pass before any distributable artifact is produced.
  desktop-appimage:
    name: Build desktop AppImage (Tauri)
    needs: release-gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2
      - name: Install desktop npm deps (Tauri CLI)
        run: npm ci --workspace client-desktop --include-workspace-root=false
      - name: Build AppImage
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./client-desktop
          args: --bundles appimage
      - name: Upload AppImage as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: opswarden-appimage
          path: client-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  attach-desktop-appimage:
    name: Attach desktop AppImage to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [create-release, desktop-appimage]
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: opswarden-appimage
          path: desktop-artifacts
      - name: Attach AppImage to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: desktop-artifacts/*.AppImage
