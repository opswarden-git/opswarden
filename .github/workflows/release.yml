---
name: Publish release
run-name: "Publish ${{ github.ref_name }}"

"on":
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  release-gate:
    name: Validate release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: opswarden
          POSTGRES_DB: opswarden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      POSTGRES_USER: opswarden
      POSTGRES_DB: opswarden
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a versioned commit from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must point to a commit reachable from main"
            exit 1
          }
          ./tooling/verify_release_version.sh "$GITHUB_REF_NAME"
      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Install Rust quality tools
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-audit,cargo-deny@0.19.7,sqlx-cli
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Configure and migrate test database
        run: |
          echo "DATABASE_URL=postgres://${POSTGRES_USER}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"
          DATABASE_URL="postgres://${POSTGRES_USER}@localhost:5432/${POSTGRES_DB}" \
            sqlx migrate run --source server/migrations
      - name: Validate backend quality and dependencies
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo audit
          cargo deny check --config tooling/deny.toml
      - name: Build and test backend
        run: |
          cargo build --workspace --verbose
          mkdir -p target/test-results
          cargo test --workspace --verbose 2>&1 | tee target/test-results/rust.log
          ./tooling/summarize_rust_tests.sh
      - name: Validate, test and build web client
        run: |
          npm run lint --workspace client-web
          npm run format:check --workspace client-web
          npm run typecheck --workspace client-web
          mkdir -p target/test-results
          npm run test:coverage --workspace client-web 2>&1 | tee target/test-results/web.log
          ./tooling/summarize_web_tests.sh
          ./tooling/audit_npm.sh
          npm run build --workspace client-web

  release-e2e:
    name: Run release browser tests
    needs: release-gate
    runs-on: ubuntu-latest
    env:
      OPSWARDEN_KICKOFF_TOKEN: CI_CONFIG_ONLY
      JWT_SECRET: CI_CONFIG_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start ephemeral application stack
        run: |
          mkdir -p target/e2e-alertmanager
          cp tooling/e2e/alertmanager-bootstrap.yml target/e2e-alertmanager/alertmanager.yml
          docker compose up --detach --build db server alertmanager
          docker compose up --detach --build --no-deps client_web
      - name: Wait for application readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health >/dev/null \
              && curl --fail --silent http://localhost:8081/en >/dev/null \
              && curl --fail --silent http://localhost:9093/-/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color server client_web alertmanager
          exit 1
      - name: Run browser suite
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-playwright-critical-path
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Print service logs after a failure
        if: failure()
        run: docker compose logs --no-color server client_web alertmanager
      - name: Stop ephemeral application stack
        if: always()
        run: docker compose down --volumes

  desktop-packages:
    name: Package desktop app for ${{ matrix.platform }}
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-22.04
            bundles: deb,appimage
            artifact_name: desktop-linux
            artifact_path: |
              client-desktop/src-tauri/target/release/bundle/deb/*.deb
              client-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: Windows
            runner: windows-latest
            bundles: nsis
            artifact_name: desktop-windows
            artifact_path: client-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          - platform: macOS
            runner: macos-14
            bundles: dmg
            artifact_name: desktop-macos
            artifact_path: client-desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2
      - name: Install locked dependencies
        run: npm ci
      - name: Build native package
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: ./client-desktop
          args: --bundles ${{ matrix.bundles }}
      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  docker-image:
    name: Build and attest server image
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opswarden-server" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  web-image:
    # Optional self-hosted artifact. The nominal public client is deployed from
    # client-web on Vercel; this image remains available for local/Kubernetes use.
    name: Build and attest self-hosted web image
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opswarden-client-web" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: client-web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPSWARDEN_API_ORIGIN=http://server:8080
            NEXT_PUBLIC_WS_URL=
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish release artifacts
    needs: [release-gate, release-e2e, desktop-packages, docker-image, web-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download every desktop package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      - name: Flatten downloaded desktop packages
        run: |
          find release-artifacts -mindepth 2 -type f \
            -exec mv -t release-artifacts -- {} +
          find release-artifacts -mindepth 1 -type d -empty -delete
      - name: Generate checksums
        working-directory: release-artifacts
        run: |
          checksum_manifest="${RUNNER_TEMP}/opswarden-SHA256SUMS"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$checksum_manifest"
          mv "$checksum_manifest" SHA256SUMS
      - name: Attest desktop package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-artifacts/*
      - name: Check out tooling and optional release highlights
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.docker-image.outputs.image }}
          DIGEST: ${{ needs.docker-image.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          ./repo/tooling/compose_release_notes.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" \
            "$IMAGE" \
            "$DIGEST" \
            release-artifacts \
            "repo/docs/release-notes/${GITHUB_REF_NAME}.md" >"$notes"
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release-artifacts/*.deb \
            release-artifacts/*.AppImage \
            release-artifacts/*-setup.exe \
            release-artifacts/*.dmg \
            release-artifacts/SHA256SUMS \
            --title "OpsWarden ${GITHUB_REF_NAME}" \
            --notes-file "$RELEASE_NOTES" \
            --verify-tag
      - name: Publish release summary
        env:
          IMAGE: ${{ needs.docker-image.outputs.image }}
          DIGEST: ${{ needs.docker-image.outputs.digest }}
        run: |
          {
            echo '## Release published'
            echo
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Server image: \`${IMAGE}@${DIGEST}\`"
            echo '- Desktop: Linux (.deb, AppImage), Windows (NSIS), macOS (DMG)'
            echo '- Provenance: GitHub artifact attestations'
          } >> "$GITHUB_STEP_SUMMARY"
