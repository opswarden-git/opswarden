# Backend source-only coverage. Tests still execute; their own lines are not
# counted in the ratio. Run: cargo tarpaulin --config tooling/tarpaulin.toml
[source_only]
workspace = true
follow-exec = true
include-tests = false
include-files = ["server/src/*"]
exclude-files = ["server/src/main.rs"]
out = ["Json", "Html", "Lcov", "Xml"]
output-dir = "../target/tarpaulin"
fail-under = 70.0
