# --- server/Cargo.toml ---

[package]
name = "opswarden-server"
version = "1.0.14"
edition = "2021"
description = "OpsWarden application server"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
ipnet = "2"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
async-trait = "0.1.89"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
argon2 = "0.5.3"
# argon2's `rand` feature pulls password-hash/rand_core but not getrandom; we
# enable getrandom on the same password-hash so `OsRng` stays available for salt
# generation (rand 0.10 moved to rand_core 0.10, dropping the old transitive feature).
password-hash = { version = "0.6", features = ["getrandom"] }
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.22" }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["grpc-tonic", "http-proto"] }
tracing-opentelemetry = "0.23"
tower-http = { version = "0.5", features = ["trace"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
