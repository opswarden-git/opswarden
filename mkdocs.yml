site_name: OpsWarden Documentation
site_description: Technical and product documentation for the OpsWarden incident management platform.
site_url: https://opswarden-git.github.io/opswarden/
repo_url: https://github.com/opswarden-git/opswarden
repo_name: opswarden-git/opswarden
edit_uri: edit/main/
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Understand:
      - Architecture: architecture/index.md
      - Data model: reference/data-model.md
  - Reference:
      - REST API: reference/rest-api.md
      - WebSocket protocol: reference/websocket.md
  - Design:
      - Design system: design/design-system.md
      - UI guidelines: design/ui-guidelines.md
  - Contribute: contributing/index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

copyright: Apache-2.0 · OpsWarden
