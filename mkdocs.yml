site_name: OpsWarden Documentation
site_description: Technical and product documentation for the OpsWarden incident management platform.
site_url: https://opswarden-git.github.io/opswarden/
repo_url: https://github.com/opswarden-git/opswarden
repo_name: opswarden-git/opswarden
edit_uri: edit/main/
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture/index.md
  - Reference:
      - Data model: reference/data-model.md
      - REST API: reference/rest-api.md
      - WebSocket protocol: reference/websocket.md
  - Design:
      - UI guidelines: design/ui-guidelines.md
      - Design system: design/design-system.md
  - Contributing: contributing/index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/force-dark.js
